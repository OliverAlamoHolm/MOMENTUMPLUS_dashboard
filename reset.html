<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña · MOMENTUM+</title><link rel="stylesheet" href="styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><form class="login-card" id="f" style="max-width:520px"><img src="logo-transparent.png" alt="MOMENTUM+"><span class="eyebrow">SEGURIDAD</span><h2>Nueva contraseña</h2><label>Nueva contraseña<input id="p" type="password" minlength="8" required></label><label>Repetir contraseña<input id="p2" type="password" minlength="8" required></label><p id="m"></p><button class="btn btn-primary full">Guardar contraseña</button></form></main><script>f.onsubmit=async e=>{e.preventDefault();if(p.value!==p2.value){m.textContent='Las contraseñas no coinciden.';return}const q=new URLSearchParams(location.search);const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:q.get('email'),token:q.get('token'),password:p.value})});const d=await r.json();m.textContent=r.ok?'Contraseña actualizada. Ya puedes volver e iniciar sesión.':d.error}</script></body></html>
